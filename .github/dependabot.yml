# Dependabot configuration for SocialHive.
#
# The repository contains two independent npm projects (Backend, Frontend),
# so each is declared separately. Grouped updates keep the number of pull
# requests low without hiding security fixes, which are pulled forward.

version: 2

updates:
  - package-ecosystem: npm
    directory: /Backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(backend)"
    groups:
      typescript:
        applies-to: version-updates
        patterns:
          - "typescript"
          - "@types/*"
          - "ts-jest"
      nest:
        applies-to: version-updates
        patterns:
          - "@nestjs/*"
          - "@nestjs/schematics"
      security:
        applies-to: security-updates
    labels:
      - dependencies
      - backend

  - package-ecosystem: npm
    directory: /Frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"
    groups:
      next:
        applies-to: version-updates
        patterns:
          - "next"
          - "eslint-config-next"
          - "eslint-import-resolver-typescript"
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        applies-to: version-updates
        patterns:
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
      security:
        applies-to: security-updates
    labels:
      - dependencies
      - frontend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
