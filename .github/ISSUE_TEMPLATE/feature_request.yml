name: Feature request
description: Propose a new capability or a change to an existing one.
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is the current behaviour, and why does it get in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change. Include API shapes, schema changes or UI flow if you have them in mind.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Small — contained in one module
        - Medium — spans backend and frontend
        - Large — architectural change
    validations:
      required: true

  - type: dropdown
    id: breaking
    attributes:
      label: Breaking change
      description: Does this require a migration, an API break, or a config change for existing users?
      options:
        - "No"
        - "Yes — needs a migration"
        - "Yes — API break"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
